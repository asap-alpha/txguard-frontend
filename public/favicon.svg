<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Matches the in-app brand mark (.brand .logo): rounded square,
       teal→blue 135° gradient, "Tx" in dark ink. -->
  <defs>
    <linearGradient id="tx" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#tx)"/>
  <text x="32" y="33" fill="#04121b" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="30" font-weight="800" text-anchor="middle" dominant-baseline="central">Tx</text>
</svg>
